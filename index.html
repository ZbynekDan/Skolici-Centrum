<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d20a2e">
<meta name="robots" content="noindex,nofollow">
<title>Školicí centrum Rossmann</title>

<body>
<div id="bar"></div>
<main id="app" class="wrap"><div class="empty">Načítám aplikaci…</div></main>

<div id="cam" class="cam" hidden role="dialog" aria-modal="true" aria-label="Skenování kamerou">

    <div class="cam-view"><video id="camVideo" playsinline muted autoplay></video><div class="cam-frame"></div></div>
    <p id="camMsg" aria-live="polite"></p>
    <button class="btn big" type="button" data-act="camClose">Zavřít · Закрити</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
